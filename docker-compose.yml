# docker compose up --build   ->  app on http://localhost:4200, API on http://localhost:5000/api/v1
# Needs backend/.env (copy backend/.env.example) with GEMINI_API_KEY. DATABASE_URL is optional:
# it defaults to SQLite, or set it to a Postgres URL (e.g. Neon).
services:
  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      FLASK_ENV: production
      HOST: 0.0.0.0
      PORT: "5000"
      CORS_ORIGINS: http://localhost:4200
    ports:
      - "5000:5000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "4200:80"